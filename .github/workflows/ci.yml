name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5

      - name: Check authority baseline before browser tests
        run: pnpm authority:check

      - name: Set up Playwright
        uses: kellen-miller/ci/.github/actions/playwright-setup@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          browsers: chromium firefox webkit

      - name: Verify repository
        run: |
          pnpm format:check
          pnpm lint
          pnpm check
          pnpm test:unit
          pnpm test:property
          pnpm test:migration
          pnpm test:component
          pnpm test:exchange
          pnpm build
          pnpm test:e2e
          pnpm test:security
          pnpm test:accessibility
          pnpm test:visual
          pnpm bundle:check
          pnpm gate:numeric
          pnpm gate:persistence
          pnpm gate:storage-lifecycle
          pnpm gate:worker
          pnpm gate:exchange
          pnpm gate:renderer
          pnpm traceability
          pnpm verify

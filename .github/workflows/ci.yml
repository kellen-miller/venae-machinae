name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5

      - name: Verify repository
        run: |
          pnpm verify
          pnpm format:check
          pnpm lint
          pnpm check
          pnpm test:unit
          pnpm test:property
          pnpm test:migration
          pnpm test:component
          pnpm test:exchange
          pnpm build
          pnpm bundle:check
          pnpm gate:evidence

  browsers:
    needs: checks
    runs-on: ubuntu-24.04
    # Cold browser dependencies and the full suite need separate time budgets.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5

      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) \
            -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +

      - name: Set up Playwright
        uses: kellen-miller/ci/.github/actions/playwright-setup@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          browsers: ${{ matrix.browser }}

      - name: Build production application
        run: pnpm build

      - name: Test production browsers
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
          BROWSER: ${{ matrix.browser }}
        run: |
          projects=(--project="$BROWSER")
          if [[ "$BROWSER" == chromium ]]; then
            projects+=(--project=workspace)
          fi

          pnpm test:browser "${projects[@]}"

      - name: Upload browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  verify:
    if: always()
    needs: [checks, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
        run: |
          [[ "$CHECKS_RESULT" == success && "$BROWSERS_RESULT" == success ]]

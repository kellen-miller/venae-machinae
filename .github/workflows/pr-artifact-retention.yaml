name: GitHub Actions artifact retention
on:
  workflow_run:
    workflows:
      - '*'
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview deletions
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
  pull-requests: read
concurrency:
  group: pr-artifact-retention
  cancel-in-progress: false
jobs:
  delete-pr-artifacts:
    name: GitHub Actions
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    uses: kellen-miller/ci/.github/workflows/pr-artifact-cleanup.yaml@c188397b9147dbf21030cf2f3e4fc41bff37358b
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      include-failed: true

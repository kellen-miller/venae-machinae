name: Capacity harness smoke

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: kellen-miller/ci/.github/workflows/changed-paths.yaml@f01aacda5b78c7b67d1dc840bd0432be852a69a4
    with:
      filters: |
        {"capacity": ["src/**", "static/**", "tests/**", "scripts/**", "*.js", "*.mjs", "*.cjs", "*.ts", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc", ".nvmrc", ".github/workflows/**", ".github/actions/**"]}

  smoke:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success' ||
          fromJSON(needs.changes.outputs.changes).capacity) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5

      - name: Set up Playwright
        uses: kellen-miller/ci/.github/actions/playwright-setup@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          browsers: chromium

      - name: Smoke capacity harness
        run: pnpm gate:capacity -- --ci-smoke

      - name: Clarify evidence scope
        run: echo 'GitHub runner timings are non-normative; authority remains the committed recorded current-local environment.'

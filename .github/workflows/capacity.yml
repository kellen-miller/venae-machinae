name: Capacity harness smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke capacity harness
        run: pnpm gate:capacity -- --ci-smoke

      - name: Clarify evidence scope
        run: echo 'GitHub runner timings are non-normative; authority remains the committed recorded current-local environment.'
